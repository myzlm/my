            // 花瓣
            function initPetals() {
                const canvas = $('#petalCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const petals = [];
                const count = isMobile ? 14 : 30;

                function resize() { width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height; }
                window.addEventListener('resize', resize);
                resize();
                class Petal {
                    constructor() { this.reset(true); }
                    reset(initial = false) { this.x = Math.random() * width;
                        this.y = initial ? Math.random() * height : -25;
                        this.size = 7 + Math.random() * 13;
                        this.speedY = 0.8 + Math.random() * 2.2;
                        this.speedX = 0.2 + Math.random() * 0.7;
                        this.rotation = Math.random() * Math.PI * 2;
                        this.rotSpeed = (Math.random() - 0.5) * 0.018;
                        this.opacity = 0.6 + Math.random() * 0.35;
                        this.hue = 340 + Math.random() * 30;
                        this.sat = 40 + Math.random() * 40;
                        this.light = 60 + Math.random() * 25; }
                    update() { this.y += this.speedY;
                        this.x += Math.sin(this.y * 0.018) * this.speedX;
                        this.rotation += this.rotSpeed; if (this.y > height + 30) this.reset(); }
                    draw(ctx) { ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.rotation);
                        ctx.fillStyle =
                            `hsla(${this.hue},${this.sat}%,${this.light}%,${this.opacity})`;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, this.size * 0.55, this.size * 0.28, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(0, 0, this.size * 0.28, this.size * 0.55, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore(); }
                }
                for (let i = 0; i < count; i++) petals.push(new Petal());

                function animate() { ctx.clearRect(0, 0, width, height);
                    petals.forEach(p => { p.update();
                        p.draw(ctx); });
                    requestAnimationFrame(animate); }
                animate();
            }

            // 诗词飘落
            function initPoems() {
                const canvas = $('#poemCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const poems = [
                    '静', '思', '墨', '韵', '雅', '书', '画', '禅', '道', '云', '风', '月', '山', '水', '花', '竹', '兰',
                    '梅',
                    '清', '幽', '淡', '远', '逸', '神', '妙', '趣', '真', '善', '美', '和', '敬', '寂', '空', '灵'
                ];
                const items = [];
                const count = isMobile ? 8 : 20;

                function resize() { width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height; }
                window.addEventListener('resize', resize);
                resize();
                class PoemChar {
                    constructor() { this.reset(true); }
                    reset(initial = false) {
                        this.x = Math.random() * width;
                        this.y = initial ? Math.random() * height : -40;
                        this.char = poems[Math.floor(Math.random() * poems.length)];
                        this.size = 14 + Math.random() * 22;
                        this.speedY = 0.3 + Math.random() * 0.9;
                        this.speedX = (Math.random() - 0.5) * 0.35;
                        this.opacity = 0.35 + Math.random() * 0.4;
                        this.wobble = Math.random() * Math.PI * 2;
                        this.wobbleSpeed = 0.01 + Math.random() * 0.03;
                    }
                    update() {
                        this.y += this.speedY;
                        this.wobble += this.wobbleSpeed;
                        this.x += Math.sin(this.wobble) * this.speedX;
                        if (this.y > height + 30) this.reset();
                    }
                    draw(ctx) {
                        ctx.save();
                        ctx.font = `${this.size}px 'Ma Shan Zheng','KaiTi','楷体',serif`;
                        ctx.fillStyle = `rgba(80,50,30,${this.opacity})`;
                        const theme = document.documentElement.getAttribute('data-theme');
                        if (theme === 'dark') ctx.fillStyle = `rgba(200,180,150,${this.opacity})`;
                        ctx.textAlign = 'center';
                        ctx.fillText(this.char, this.x, this.y);
                        ctx.restore();
                    }
                }
                for (let i = 0; i < count; i++) items.push(new PoemChar());

                function animate() { ctx.clearRect(0, 0, width, height);
                    items.forEach(p => { p.update();
                        p.draw(ctx); });
                    requestAnimationFrame(animate); }
                animate();
            }

            // 涟漪
            function initRipples() {
                const canvas = $('#rippleCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const ripples = [];
                const maxRipples = 18;

                function resize() { width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height; }
                window.addEventListener('resize', resize);
                resize();

                function addRipple(x, y) {
                    ripples.push({ x, y, radius: 2, maxRadius: 40 + Math.random() * 70, opacity: 0.65, speed: 0.7 + Math
                            .random() * 0.7, hue: 25 + Math.random() * 20 });
                    if (ripples.length > maxRipples) ripples.shift();
                }
                window.addEventListener('click', (e) => addRipple(e.clientX, e.clientY));
                window.addEventListener('touchstart', (e) => { if (e.touches.length === 1) addRipple(e.touches[0].clientX,
                        e.touches[0].clientY); }, { passive: true });

                function drawRipple(ctx, r) {
                    const gradient = ctx.createRadialGradient(r.x, r.y, r.radius * 0.05, r.x, r.y, r.radius);
                    gradient.addColorStop(0, `rgba(30,20,12,${r.opacity})`);
                    gradient.addColorStop(0.35, `rgba(50,35,22,${r.opacity*0.65})`);
                    gradient.addColorStop(0.7, `rgba(90,65,40,${r.opacity*0.25})`);
                    gradient.addColorStop(1, `rgba(140,110,70,0)`);
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.fill();
                    // 金色光环
                    ctx.strokeStyle = `rgba(180,150,100,${r.opacity*0.35})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius * 0.85, 0, Math.PI * 2);
                    ctx.stroke();
                }

                function animate() { ctx.clearRect(0, 0, width, height); for (let i = ripples.length - 1; i >= 0; i--) { const
                            r = ripples[i];
                        r.radius += r.speed;
                        r.opacity -= 0.007; if (r.opacity <= 0 || r.radius > r.maxRadius) ripples.splice(i, 1); else
                            drawRipple(ctx, r); }
                    requestAnimationFrame(animate); }
                animate();
            }

            // 萤火虫
            function initFireflies() {
                const canvas = $('#fireflyCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const fireflies = [];
                const count = isMobile ? 10 : 25;
                let mouseX = -200,
                    mouseY = -200;

                function resize() { width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height; }
                window.addEventListener('resize', resize);
                resize();
                document.addEventListener('mousemove', (e) => { mouseX = e.clientX;
                    mouseY = e.clientY; }, { passive: true });
                document.addEventListener('touchmove', (e) => { if (e.touches.length === 1) { mouseX = e.touches[0]
                        .clientX;
                        mouseY = e.touches[0].clientY; } }, { passive: true });

                class Firefly {
                    constructor() { this.reset(); }
                    reset() {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                        this.targetX = this.x;
                        this.targetY = this.y;
                        this.size = 2 + Math.random() * 4;
                        this.glowSize = this.size * 4 + Math.random() * 10;
                        this.opacity = 0.3 + Math.random() * 0.55;
                        this.phase = Math.random() * Math.PI * 2;
                        this.speed = 0.3 + Math.random() * 0.7;
                        this.changeTargetTime = 0;
                    }
                    update() {
                        this.changeTargetTime--;
                        if (this.changeTargetTime <= 0) {
                            this.targetX = this.x + (Math.random() - 0.5) * 180;
                            this.targetY = this.y + (Math.random() - 0.5) * 140;
                            this.targetX = Math.max(10, Math.min(width - 10, this.targetX));
                            this.targetY = Math.max(10, Math.min(height - 10, this.targetY));
                            // 偶尔靠近鼠标
                            if (Math.random() < 0.25 && mouseX > 0) {
                                this.targetX = mouseX + (Math.random() - 0.5) * 100;
                                this.targetY = mouseY + (Math.random() - 0.5) * 80;
                            }
                            this.changeTargetTime = 40 + Math.random() * 80;
                        }
                        this.x += (this.targetX - this.x) * 0.02 * this.speed;
                        this.y += (this.targetY - this.y) * 0.02 * this.speed;
                        this.phase += 0.03;
                        this.opacity = 0.3 + Math.sin(this.phase) * 0.3;
                    }
                    draw(ctx) {
                        const glow = ctx.createRadialGradient(this.x, this.y, this.size * 0.2, this.x, this.y, this
                            .glowSize);
                        glow.addColorStop(0, `rgba(255,230,150,${this.opacity})`);
                        glow.addColorStop(0.3, `rgba(240,200,100,${this.opacity*0.7})`);
                        glow.addColorStop(0.7, `rgba(200,160,60,${this.opacity*0.2})`);
                        glow.addColorStop(1, 'rgba(180,140,50,0)');
                        ctx.fillStyle = glow;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.glowSize, 0, Math.PI * 2);
                        ctx.fill();
                        // 亮点
                        ctx.fillStyle = `rgba(255,255,220,${this.opacity+0.15})`;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                for (let i = 0; i < count; i++) fireflies.push(new Firefly());

                function animate() { ctx.clearRect(0, 0, width, height);
                    fireflies.forEach(f => { f.update();
                        f.draw(ctx); });
                    requestAnimationFrame(animate); }
                animate();
            }

            // 锦鲤
            function initKoi() {
                const container = $('#koiContainer');
                const koi = document.createElement('div');
                koi.style.cssText = `
              position:absolute; font-size:${isMobile?'28px':'40px'}; pointer-events:none;
              opacity:0; transition:opacity 1.5s ease;
              filter:drop-shadow(0 3px 8px rgba(0,0,0,0.25));
              animation: koiSwim var(--swim-dur,18s) linear infinite;
              left:-80px; top:var(--swim-y,40%);
            `;
                koi.textContent = '🐟';
                container.appendChild(koi);

                function resetKoi() {
                    const y = 15 + Math.random() * 65;
                    const dur = 14 + Math.random() * 22;
                    koi.style.setProperty('--swim-y', y + '%');
                    koi.style.setProperty('--swim-dur', dur + 's');
                    koi.style.opacity = '0';
                    setTimeout(() => { koi.style.opacity = '0.7'; }, 600);
                }
                if (!document.getElementById('koiSwimStyle')) {
                    const style = document.createElement('style');
                    style.id = 'koiSwimStyle';
                    style.textContent =
                        `@keyframes koiSwim{0%{left:-80px;transform:scaleX(1);}48%{left:105vw;transform:scaleX(1);}52%{left:105vw;transform:scaleX(-1);}100%{left:-80px;transform:scaleX(-1);}}`;
                    document.head.appendChild(style);
                }
                resetKoi();
                setInterval(resetKoi, 20000 + Math.random() * 15000);
            }

            // 回到顶部
            function initBackToTop() {
                const btn = $('#backToTop');
                window.addEventListener('scroll', () => { if (window.scrollY > 400) btn.classList.add('visible');
                    else btn.classList.remove('visible'); }, { passive: true });
                btn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });
            }

            // 牌匾3D交互
            function initPlaque3D() {
                const plaque = $('#plaqueEl');
                if (!plaque || isMobile) return;
                plaque.addEventListener('mousemove', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const rx = ((y / rect.height) - 0.5) * 8;
                    const ry = ((x / rect.width) - 0.5) * 6;
                    this.style.transform = `perspective(400px) rotateX(${-rx}deg) rotateY(${ry}deg) translateY(-3px)`;
                });
                plaque.addEventListener('mouseleave', function() {
                    this.style.transform = 'perspective(400px) rotateX(0deg) rotateY(0deg) translateY(0px)';
                });
            }

            // 绑定事件
            function bindEvents() {
                $('#themeToggle').addEventListener('click', toggleTheme);
                const searchInput = $('#searchInput');
                const searchClear = $('#searchClear');
                let searchDebounce;
                searchInput.addEventListener('input', () => {
                    clearTimeout(searchDebounce);
                    searchDebounce = setTimeout(() => {
                        searchQuery = searchInput.value;
                        searchClear.classList.toggle('visible', !!searchQuery.trim());
                        renderFilterTags();
                        renderSites();
                    }, 200);
                });
                searchClear.addEventListener('click', () => { searchInput.value = '';
                    searchQuery = '';
                    searchClear.classList.remove('visible');
                    renderFilterTags();
                    renderSites();
                    searchInput.focus(); });
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault();
                        searchInput.focus();
                        searchInput.select(); }
                    if (e.key === 'Escape' && document.activeElement === searchInput) { searchInput.value = '';
                        searchQuery = '';
                        searchClear.classList.remove('visible');
                        renderFilterTags();
                        renderSites();
                        searchInput.blur(); }
                    if (e.key === '/' && document.activeElement === document.body && !e.target.closest('input') && !e
                        .target.closest('textarea')) { e.preventDefault();
                        searchInput.focus(); }
                });
                $('#loginBtn').addEventListener('click', () => $('#loginModal').classList.add('active'));
                $('#closeLoginModal').addEventListener('click', () => $('#loginModal').classList.remove('active'));
                $('#submitLogin').addEventListener('click', async () => {
                    const u = $('#loginUsername').value.trim();
                    const p = $('#loginPassword').value;
                    if (!u || !p) return showToast('请输入账号和密码', 'error');
                    try {
                        const data = await apiCall('/api/login', { method: 'POST', body: { username: u,
                            password: p } });
                        currentUser = { username: data.username, role: data.role };
                        $('#loginModal').classList.remove('active');
                        updateUIByRole();
                        if (currentUser.role === 'admin') refreshUsersAndRender();
                        showToast(`登录成功，欢迎 ${data.username}`, 'success');
                    } catch (err) { showToast('登录失败: ' + err.message, 'error'); }
                });
                $('#logoutBtn').addEventListener('click', async () => { await apiCall('/api/logout', { method: 'POST' });
                    currentUser = null;
                    updateUIByRole();
                    showToast('已登出', 'info'); });
                $('#adminPanelBtn').addEventListener('click', () => { const panel = $('#adminPanel');
                    panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; });
                $$('.tab-btn').forEach(btn => { btn.addEventListener('click', function() { $$('.tab-btn').forEach(b => b
                            .classList.remove('active'));
                        this.classList.add('active');
                        $$('.tab-content').forEach(c => c.classList.remove('active'));
                        $('#' + this.dataset.tab).classList.add('active'); }); });
                $('#addSiteBtn').addEventListener('click', async () => {
                    const name = $('#newSiteName').value.trim();
                    const url = $('#newSiteUrl').value.trim();
                    if (!name || !url) return showToast('名称和网址必填', 'error');
                    try {
                        await apiCall('/api/sites', { method: 'POST', body: { name, url, desc: $('#newSiteDesc')
                                    .value.trim(), seal: $('#newSiteSeal').value.trim() || '🔗',
                                category: $('#newSiteCat').value.trim() || '其他' } });
                        ['newSiteName', 'newSiteUrl', 'newSiteDesc', 'newSiteSeal', 'newSiteCat'].forEach(id => $('#' +
                            id).value = '');
                        await refreshSites();
                        showToast('网站已添加', 'success');
                    } catch (err) { showToast(err.message, 'error'); }
                });
                $('#addUserBtn').addEventListener('click', async () => {
                    const u = $('#newUsername').value.trim();
                    const p = $('#newUserPass').value;
                    if (!u || !p) return showToast('用户名和密码不能为空', 'error');
                    try { await apiCall('/api/users', { method: 'POST', body: { username: u, password: p } });
                        $('#newUsername').value = '';
                        $('#newUserPass').value = '';
                        refreshUsersAndRender();
                        showToast('用户已添加', 'success'); } catch (err) { showToast(err.message, 'error'); }
                });
                $('#submitChangePass').addEventListener('click', async () => {
                    const username = $('#changePassUser').value;
                    const np = $('#changePassNew').value;
                    if (!np) return showToast('请输入新密码', 'error');
                    if (username === 'zlm') { showToast('修改主管理员密码需要后端专用接口。', 'error'); return; }
                    if (!confirm(`将通过删除并重建用户"${username}"来修改密码，继续？`)) return;
                    try { await apiCall(`/api/users/${encodeURIComponent(username)}`, { method: 'DELETE' });
                        await apiCall('/api/users', { method: 'POST', body: { username, password: np } });
                        showToast('密码已修改', 'success');
                        $('#changePassModal').classList.remove('active');
                        refreshUsersAndRender(); } catch (err) { showToast('操作失败: ' + err.message, 'error'); }
                });
                $('#closeChangePassModal').addEventListener('click', () => $('#changePassModal').classList.remove(
                'active'));
                $('#changeMyPassBtn').addEventListener('click', () => { $('#selfOldPass').value = '';
                    $('#selfNewPass').value = '';
                    $('#selfChangePassModal').classList.add('active'); });
                $('#closeSelfChangePassModal').addEventListener('click', () => $('#selfChangePassModal').classList.remove(
                    'active'));
                $('#submitSelfChangePass').addEventListener('click', async () => {
                    const op = $('#selfOldPass').value;
                    const np = $('#selfNewPass').value;
                    if (!op || !np) return showToast('请输入旧密码和新密码', 'error');
                    if (np.length < 6) return showToast('新密码长度至少6位', 'error');
                    try { await apiCall('/api/me/password', { method: 'PUT', body: { oldPassword: op,
                            newPassword: np } });
                        showToast('密码修改成功', 'success');
                        $('#selfChangePassModal').classList.remove('active'); } catch (err) { showToast('修改失败: ' + err
                            .message, 'error'); }
                });
                $('#applySiteBtn').addEventListener('click', () => { $('#applyName').value = '';
                    $('#applyUrl').value = '';
                    $('#applyDesc').value = '';
                    $('#applySeal').value = '';
                    $('#applyCat').value = '';
                    $('#applyModal').classList.add('active'); });
                $('#closeApplyModal').addEventListener('click', () => $('#applyModal').classList.remove('active'));
                $('#submitApply').addEventListener('click', () => {
                    const name = $('#applyName').value.trim();
                    const url = $('#applyUrl').value.trim();
                    if (!name || !url) return showToast('网站名称和网址为必填项', 'error');
                    siteApplications.push({ name, url, desc: $('#applyDesc').value.trim(), seal: $('#applySeal').value
                            .trim() || '🔗', category: $('#applyCat').value.trim() || '其他' });
                    localStorage.setItem(APPLY_STORAGE_KEY, JSON.stringify(siteApplications));
                    showToast('申请已提交，请等待管理员审核', 'success');
                    $('#applyModal').classList.remove('active');
                });
                window.addEventListener('click', (e) => { if (e.target.classList.contains('modal-overlay')) e.target
                        .classList.remove('active'); });
            }

            async function init() {
                initTheme();
                initStars();
                initClouds();
                initPetals();
                initPoems();
                initRipples();
                initFireflies();
                initKoi();
                initCustomCursor();
                initBackToTop();
                initPlaque3D();
                bindEvents();
                try { sites = await apiCall('/api/sites');
                    isLoading = false; } catch (e) { sites = [];
                    isLoading = false; }
                await checkLoginStatus();
                renderSites();
                renderFilterTags();
            }
            init();
        })();
    </script>
</body>
