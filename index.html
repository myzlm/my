<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>墨韵·书签雅集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pc: url('bg-pc.png');
            --bg-mobile: url('bg-mobile.png');
            --ink: #2c2c2c;
            --ink-light: #4a3828;
            --red-seal: #c53b3b;
            --gold: #b89b5a;
            --gold-light: #c5a46b;
            --parchment: #fdf8f0;
            --parchment-warm: #f5efe0;
            --shadow-soft: 0 8px 20px rgba(0, 0, 0, 0.15);
            --shadow-card: 0 4px 10px rgba(0, 0, 0, 0.08);
            --shadow-card-hover: 0 12px 28px rgba(0, 0, 0, 0.18);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --card-bg: rgba(255, 255, 250, 0.28);
            --card-bg-hover: rgba(255, 255, 250, 0.48);
            --card-border: rgba(180, 150, 100, 0.4);
            --card-border-hover: #b89b5a;
            --text-primary: #2e2210;
            --text-secondary: #4a3828;
            --text-muted: #5e4e3a;
            --tag-bg: rgba(231, 220, 200, 0.8);
            --input-bg: rgba(255, 255, 250, 0.8);
            --input-border: #cfbfa0;
            --modal-bg: #fdf8f0;
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --btn-bg: rgba(255, 250, 240, 0.6);
            --btn-border: #9e8b6b;
            --btn-text: #3e2e1f;
            --btn-hover-bg: rgba(197, 164, 107, 0.8);
            --btn-hover-text: #fff;
            --divider-color: rgba(180, 150, 100, 0.5);
            --admin-bg: rgba(245, 240, 230, 0.75);
            --admin-border: #d4b896;
            --list-border: #d4b896;
            --greeting-bg: rgba(255, 250, 240, 0.5);
            --greeting-text: #3e2e1f;
            --skeleton-shine: rgba(255, 255, 255, 0.5);
        }

        [data-theme="dark"] {
            --bg-pc: url('bg-pc.png');
            --bg-mobile: url('bg-mobile.png');
            --ink: #d4c5b2;
            --ink-light: #c4b5a2;
            --red-seal: #d45555;
            --gold: #c4a56a;
            --gold-light: #d4b57a;
            --parchment: #2a2218;
            --parchment-warm: #32291e;
            --shadow-soft: 0 8px 20px rgba(0, 0, 0, 0.4);
            --shadow-card: 0 4px 10px rgba(0, 0, 0, 0.25);
            --shadow-card-hover: 0 12px 28px rgba(0, 0, 0, 0.4);
            --card-bg: rgba(40, 35, 25, 0.55);
            --card-bg-hover: rgba(50, 42, 30, 0.7);
            --card-border: rgba(160, 130, 80, 0.45);
            --card-border-hover: #c4a56a;
            --text-primary: #e8dcc8;
            --text-secondary: #d4c5b2;
            --text-muted: #b8a890;
            --tag-bg: rgba(60, 50, 35, 0.7);
            --input-bg: rgba(40, 35, 25, 0.7);
            --input-border: #6b5a40;
            --modal-bg: #2a2218;
            --overlay-bg: rgba(0, 0, 0, 0.7);
            --btn-bg: rgba(50, 42, 30, 0.7);
            --btn-border: #6b5a40;
            --btn-text: #d4c5b2;
            --btn-hover-bg: rgba(180, 150, 100, 0.7);
            --btn-hover-text: #1a1410;
            --divider-color: rgba(160, 130, 80, 0.4);
            --admin-bg: rgba(40, 35, 25, 0.8);
            --admin-border: #5a4a32;
            --list-border: #5a4a32;
            --greeting-bg: rgba(50, 42, 30, 0.6);
            --greeting-text: #d4c5b2;
            --skeleton-shine: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL XiaoWei', 'Ma Shan Zheng', 'KaiTi', '楷体', serif;
            min-height: 100vh;
            background-color: #e8dcc8;
            background-image: var(--bg-pc);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0.5rem 1rem 2rem;
            position: relative;
            overflow-x: hidden;
            color: var(--ink);
            transition: background-color 0.5s ease, color 0.4s ease;
        }

        [data-theme="dark"] body {
            background-color: #1a1410;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: transparent;
            transition: background 0.5s ease;
        }

        [data-theme="dark"] body::before {
            background: rgba(10, 6, 2, 0.55);
        }

        @media (max-width: 768px) {
            body {
                background-image: var(--bg-mobile);
                padding: 0.5rem 0.5rem 1.5rem;
            }
        }

        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            transition: opacity 0.5s ease;
        }
        [data-theme="dark"] .clouds {
            opacity: 0.35;
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            filter: blur(18px);
            opacity: 0.5;
            animation: floatCloud linear infinite;
        }
        [data-theme="dark"] .cloud {
            background: rgba(200, 180, 150, 0.35);
            opacity: 0.3;
        }
        .cloud::after,
        .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud::before {
            width: 70%;
            height: 70%;
            top: -35%;
            left: 15%;
        }
        .cloud::after {
            width: 50%;
            height: 50%;
            top: -25%;
            right: 10%;
        }
        @keyframes floatCloud {
            0% {
                transform: translateX(-120%);
            }
            100% {
                transform: translateX(120vw);
            }
        }
        #petalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.5s ease;
        }
        [data-theme="dark"] #petalCanvas {
            opacity: 0.55;
        }
        #rippleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1.5;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            background: transparent;
            backdrop-filter: none;
            border-radius: 0;
            box-shadow: none;
            padding: 1rem 0.5rem 2rem;
            border: none;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        /* Header */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px dashed var(--divider-color);
            transition: border-color 0.4s ease;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 0.3rem;
        }
        .greeting {
            font-size: 1.05rem;
            color: var(--greeting-text);
            text-shadow: 1px 1px 2px rgba(255, 255, 240, 0.8);
            background: var(--greeting-bg);
            padding: 0.25rem 0.9rem;
            border-radius: 20px;
            transition: all 0.4s ease;
        }
        [data-theme="dark"] .greeting {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
        }
        .btn {
            background: var(--btn-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid var(--btn-border);
            color: var(--btn-text);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        .btn:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
            border-color: var(--gold-light);
            box-shadow: 0 4px 14px rgba(180, 140, 80, 0.35);
            transform: translateY(-1px);
        }
        .btn.admin-btn {
            border-color: #b88a4b;
            color: #5a3e2b;
            font-weight: bold;
            background: rgba(245, 235, 210, 0.7);
        }
        [data-theme="dark"] .btn.admin-btn {
            border-color: #c4a56a;
            color: #d4c5b2;
            background: rgba(60, 48, 30, 0.7);
        }
        .btn.theme-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
        }
        .btn.icon-btn {
            padding: 0.45rem 0.9rem;
            font-size: 0.9rem;
            letter-spacing: 0;
        }

        /* Plaque */
        .plaque-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 0;
        }
        .plaque {
            position: relative;
            background: repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0, 0, 0, 0.06) 3px, rgba(0, 0, 0, 0.06) 5px),
                repeating-linear-gradient(180deg, rgba(255, 220, 160, 0.03) 0px, rgba(255, 220, 160, 0.03) 1px, transparent 1px, transparent 3px),
                linear-gradient(180deg, #5c3822 0%, #3d1f08 30%, #4a2610 60%, #2f1505 100%);
            border-radius: 8px;
            padding: 0.8rem 2.5rem;
            border: 4px solid #3a1f0a;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3),
                inset 0 0 0 3px #8b6914, inset 0 0 0 7px #3d1f08,
                inset 0 0 0 9px #c4a44a, inset 0 0 0 12px #2a1405;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 0.5rem;
        }
        .plaque:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 3px 8px rgba(0, 0, 0, 0.35),
                inset 0 0 0 3px #8b6914, inset 0 0 0 7px #3d1f08,
                inset 0 0 0 9px #c4a44a, inset 0 0 0 12px #2a1405;
        }
        @media (max-width: 768px) {
            .plaque {
                padding: 0.6rem 1.2rem;
                border-width: 3px;
            }
            .plaque-title {
                font-size: clamp(1.6rem, 5.5vw, 2.2rem);
                letter-spacing: 4px;
                white-space: normal;
            }
        }
        .plaque::before {
            content: '';
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            background: radial-gradient(circle 8px, #b8944b 40%, #6b4f10 60%, transparent 65%) 10px 8px,
                radial-gradient(circle 8px, #b8944b 40%, #6b4f10 60%, transparent 65%) 40px 8px;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }
        .plaque::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background: radial-gradient(circle 7px, #c49a4b 35%, #7a5c2a 55%, transparent 60%) 0px 0px,
                radial-gradient(circle 7px, #c49a4b 35%, #7a5c2a 55%, transparent 60%) 100% 0px,
                radial-gradient(circle 7px, #c49a4b 35%, #7a5c2a 55%, transparent 60%) 0px 100%,
                radial-gradient(circle 7px, #c49a4b 35%, #7a5c2a 55%, transparent 60%) 100% 100%;
            background-repeat: no-repeat;
            z-index: 2;
            opacity: 0.8;
            pointer-events: none;
        }
        .plaque .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 240, 0.08), rgba(255, 255, 240, 0.15), rgba(255, 255, 240, 0.08), transparent);
            animation: plaqueShine 5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            border-radius: 4px;
        }
        @keyframes plaqueShine {
            0% {
                left: -60%;
            }
            60% {
                left: 110%;
            }
            100% {
                left: 110%;
            }
        }
        .plaque-title {
            font-family: 'ZCOOL QingKe HuangYou', 'Ma Shan Zheng', 'STXingkai', '华文行楷', 'KaiTi', '楷体', serif;
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            font-weight: normal;
            color: #e8d5a3;
            letter-spacing: 8px;
            text-shadow: 1px 0 0 rgba(0, 0, 0, 0.7), -1px 0 0 rgba(0, 0, 0, 0.4), 0 1px 0 rgba(0, 0, 0, 0.6), 0 -1px 0 rgba(0, 0, 0, 0.3),
                2px 2px 3px rgba(0, 0, 0, 0.6), -1px -1px 1px rgba(255, 240, 200, 0.25),
                0 0 12px rgba(200, 160, 60, 0.5), 0 0 30px rgba(180, 130, 40, 0.35), 0 4px 8px rgba(0, 0, 0, 0.55);
            position: relative;
            z-index: 1;
            white-space: nowrap;
            line-height: 1.3;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6));
        }

        /* 搜索栏 */
        .search-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 0.3rem;
        }
        .search-container {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 480px;
        }
        .search-input {
            width: 100%;
            padding: 0.65rem 2.6rem 0.65rem 1.2rem;
            border: 1.5px solid var(--input-border);
            border-radius: 30px;
            background: var(--input-bg);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: all var(--transition);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            letter-spacing: 0.5px;
        }
        .search-input:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 0 3px rgba(180, 150, 100, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .search-input::placeholder {
            color: #a09080;
            opacity: 0.7;
        }
        [data-theme="dark"] .search-input::placeholder {
            color: #8a7a65;
        }
        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #a09080;
            padding: 4px 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: none;
            line-height: 1;
        }
        .search-clear.visible {
            display: block;
        }
        .search-clear:hover {
            color: #6b5a40;
            background: rgba(0, 0, 0, 0.06);
        }
        .search-shortcut {
            font-size: 0.7rem;
            color: #a09080;
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 0;
            white-space: nowrap;
            pointer-events: none;
            position: absolute;
            right: 36px;
            top: 50%;
            transform: translateY(-50%);
            transition: opacity 0.2s ease;
        }
        .search-input:focus~.search-shortcut,
        .search-input:not(:placeholder-shown)~.search-shortcut {
            opacity: 0;
        }

        /* 分类筛选标签 */
        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
            margin-top: 0.3rem;
        }
        .filter-tag {
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1.5px solid transparent;
            background: var(--tag-bg);
            color: var(--text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .filter-tag:hover {
            border-color: var(--gold-light);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .filter-tag.active {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
            font-weight: bold;
            box-shadow: 0 2px 10px rgba(180, 150, 100, 0.35);
        }
        [data-theme="dark"] .filter-tag.active {
            color: #1a1410;
        }
        .filter-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            opacity: 0.8;
        }

        /* 书签网格 */
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        @media (max-width: 600px) {
            .sites-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
        .site-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all var(--transition);
            cursor: pointer;
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }
        .site-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 240, 0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .site-card:hover::after {
            opacity: 1;
        }
        .site-card:hover {
            transform: translateY(-5px);
            background: var(--card-bg-hover);
            border-color: var(--card-border-hover);
            box-shadow: var(--shadow-card-hover);
        }
        .site-card:active {
            transform: scale(0.97);
            transition: transform 0.1s ease;
        }
        .seal {
            width: 50px;
            height: 50px;
            min-width: 50px;
            background: var(--red-seal);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-family: 'Ma Shan Zheng', cursive;
            box-shadow: 0 2px 8px rgba(180, 60, 60, 0.4);
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }
        .site-card:hover .seal {
            transform: rotate(-8deg) scale(1.08);
            box-shadow: 0 4px 14px rgba(180, 60, 60, 0.55);
        }
        .site-info {
            flex: 1;
            min-width: 0;
        }
        .site-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(255, 255, 240, 0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }
        [data-theme="dark"] .site-name {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .site-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-shadow: 0 1px 2px rgba(255, 255, 240, 0.7);
            margin-top: 0.2rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        [data-theme="dark"] .site-desc {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .site-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            gap: 0.3rem;
        }
        .site-category {
            background: var(--tag-bg);
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 0.72rem;
        }

        /* 骨架屏 */
        .skeleton-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid var(--card-border);
            animation: skeletonPulse 1.6s ease-in-out infinite;
        }
        .skeleton-seal {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(180, 160, 140, 0.35);
            flex-shrink: 0;
        }
        .skeleton-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .skeleton-line {
            height: 14px;
            border-radius: 8px;
            background: rgba(180, 160, 140, 0.3);
        }
        .skeleton-line.short {
            width: 60%;
        }
        .skeleton-line.medium {
            width: 80%;
        }
        @keyframes skeletonPulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.8rem;
            opacity: 0.6;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            pointer-events: none;
        }
        @media (max-width: 480px) {
            .toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
                align-items: center;
            }
        }
        .toast {
            background: var(--parchment-warm);
            border: 1px solid var(--gold-light);
            border-radius: 16px;
            padding: 0.8rem 1.3rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-primary);
            pointer-events: auto;
            animation: toastIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1), toastOut 0.35s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
            animation-delay: 0s, 2.2s;
            max-width: 400px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toast.success {
            border-left: 4px solid #6b9e5a;
        }
        .toast.error {
            border-left: 4px solid #c53b3b;
        }
        .toast.info {
            border-left: 4px solid #5a8ab5;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(40px);
            }
        }

        /* 回到顶部 */
        .back-to-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 50;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--btn-bg);
            border: 1.5px solid var(--btn-border);
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            transition: all var(--transition);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--btn-text);
        }
        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .back-to-top:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal {
            background: var(--modal-bg);
            border-radius: 32px;
            padding: 2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold-light);
            position: relative;
            transition: background 0.4s ease;
        }
        .modal h2 {
            text-align: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.3rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--input-border);
            border-radius: 30px;
            background: var(--input-bg);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            color: var(--text-primary);
            transition: all var(--transition);
        }
        .input-group input:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 0 3px rgba(180, 150, 100, 0.12);
        }
        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #8b7a62;
            transition: color 0.2s ease;
            line-height: 1;
        }
        .close-btn:hover {
            color: #c53b3b;
        }

        /* 管理面板 */
        .admin-panel {
            background: var(--admin-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid var(--admin-border);
            margin-top: 1rem;
            transition: all 0.4s ease;
        }
        .tab-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px dashed var(--list-border);
            flex-wrap: wrap;
            gap: 0.5rem;
            transition: border-color 0.4s ease;
        }
        .warning {
            color: #b45f5f;
            font-size: 0.85rem;
        }
        .input-group.input {
            padding: 0.5rem 0.8rem;
            border-radius: 24px;
            border: 1px solid var(--input-border);
            font-family: inherit;
            background: var(--input-bg);
            flex: 1 1 120px;
            min-width: 100px;
            color: var(--text-primary);
        }
        form {
            display: contents;
        }

        /* 响应式优化 */
        @media (max-width: 768px) {
            .plaque {
                padding: 0.5rem 0.8rem;
                border-width: 3px;
            }
            .plaque-title {
                font-size: clamp(1.5rem, 5vw, 2rem);
                letter-spacing: 3px;
                white-space: normal;
            }
            .search-container {
                max-width: 100%;
            }
            .btn {
                padding: 0.4rem 0.9rem;
                font-size: 0.85rem;
            }
            .site-card {
                padding: 1rem;
                gap: 0.8rem;
            }
            .seal {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 1.5rem;
            }
            .back-to-top {
                bottom: 16px;
                right: 16px;
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }
            .toast {
                max-width: 90vw;
                font-size: 0.85rem;
                padding: 0.65rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="clouds" id="cloudsContainer"></div>
    <canvas id="petalCanvas"></canvas>
    <canvas id="rippleCanvas"></canvas>

    <!-- Toast容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop" title="回到顶部" aria-label="回到顶部">⬆</button>

    <div class="main-container">
        <div class="header">
            <div class="plaque-wrapper">
                <div class="plaque">
                    <span class="shine"></span>
                    <h1 class="plaque-title">墨韵·书签雅集</h1>
                </div>
            </div>
            <div class="user-area" id="userArea">
                <span class="greeting" id="greetingText">未登录·游客</span>
                <button class="btn theme-btn" id="themeToggle" title="切换暗色模式" aria-label="切换暗色模式">🌓</button>
                <button class="btn" id="loginBtn">登 录</button>
                <button class="btn" id="changeMyPassBtn" style="display:none;">修改密码</button>
                <button class="btn" id="applySiteBtn" style="display:none;">📜 申请网站</button>
                <button class="btn admin-btn" id="adminPanelBtn" style="display:none;">管理</button>
                <button class="btn" id="logoutBtn" style="display:none;">登出</button>
            </div>
            <!-- 搜索栏 -->
            <div class="search-wrapper">
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索书签名称或描述..." autocomplete="off">
                    <span class="search-shortcut" id="searchShortcut">Ctrl+K</span>
                    <button class="search-clear" id="searchClear" aria-label="清除搜索">&times;</button>
                </div>
            </div>
            <!-- 分类筛选标签 -->
            <div class="filter-tags" id="filterTags">
                <span class="filter-tag active" data-category="all">全部</span>
            </div>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <div class="sites-grid" id="sitesGrid"></div>

        <div class="admin-panel" id="adminPanel" style="display:none;">
            <h3 style="font-family:'Ma Shan Zheng'; font-size:1.8rem; color:var(--text-primary);">🔰 管理面板</h3>
            <div class="tab-buttons">
                <button class="btn tab-btn active" data-tab="siteManage">网站管理</button>
                <button class="btn tab-btn" data-tab="userManage">用户管理</button>
                <button class="btn tab-btn" data-tab="applyManage">待审核网站</button>
            </div>
            <div class="tab-content active" id="siteManage">
                <form onsubmit="return false" style="margin-bottom:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <input type="text" id="newSiteName" placeholder="网站名称" class="input-group input">
                    <input type="text" id="newSiteUrl" placeholder="网址" class="input-group input">
                    <input type="text" id="newSiteDesc" placeholder="描述" class="input-group input">
                    <input type="text" id="newSiteSeal" placeholder="印章(1字)" maxlength="2" class="input-group input">
                    <input type="text" id="newSiteCat" placeholder="分类" class="input-group input">
                    <button class="btn" id="addSiteBtn">添加网站</button>
                </form>
                <div id="siteListManage"></div>
            </div>
            <div class="tab-content" id="userManage">
                <form onsubmit="return false" style="margin-bottom:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <input type="text" id="newUsername" placeholder="新用户名" class="input-group input" autocomplete="off">
                    <input type="password" id="newUserPass" placeholder="密码" class="input-group input" autocomplete="new-password">
                    <button class="btn" id="addUserBtn">添加用户</button>
                </form>
                <div id="userListManage"></div>
                <p class="warning">※ 修改他人密码：将删除原用户并重新创建相同用户名。修改主管理员(zlm)密码需后端支持。</p>
            </div>
            <div class="tab-content" id="applyManage">
                <div id="applyListManage"></div>
            </div>
        </div>
    </div>

    <!-- 登录模态框 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <button class="close-btn" id="closeLoginModal">&times;</button>
            <h2>登录书斋</h2>
            <form onsubmit="return false">
                <div class="input-group"><label>账号</label><input type="text" id="loginUsername" placeholder="请输入账号" autocomplete="username"></div>
                <div class="input-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password"></div>
                <div class="modal-actions"><button class="btn" id="submitLogin">登 录</button></div>
            </form>
            <p style="text-align:center; margin-top:1rem; font-size:0.85rem; color:var(--text-muted);">游客可浏览，登录后更多功能</p>
        </div>
    </div>

    <!-- 申请网站模态框 -->
    <div class="modal-overlay" id="applyModal">
        <div class="modal">
            <button class="close-btn" id="closeApplyModal">&times;</button>
            <h2>申请收录网站</h2>
            <form onsubmit="return false">
                <div class="input-group"><label>网站名称</label><input type="text" id="applyName" placeholder="必填"></div>
                <div class="input-group"><label>网址</label><input type="text" id="applyUrl" placeholder="必填"></div>
                <div class="input-group"><label>描述</label><input type="text" id="applyDesc"></div>
                <div class="input-group"><label>印章(一字)</label><input type="text" id="applySeal" maxlength="2"></div>
                <div class="input-group"><label>分类</label><input type="text" id="applyCat"></div>
                <div class="modal-actions"><button class="btn" id="submitApply">提交申请</button></div>
            </form>
        </div>
    </div>

    <!-- 管理员批量改密模态框 -->
    <div class="modal-overlay" id="changePassModal">
        <div class="modal">
            <button class="close-btn" id="closeChangePassModal">&times;</button>
            <h2>修改用户密码</h2>
            <form onsubmit="return false">
                <div class="input-group"><label>用户名</label><input type="text" id="changePassUser" readonly></div>
                <div class="input-group"><label>新密码</label><input type="password" id="changePassNew" autocomplete="new-password"></div>
                <div class="modal-actions"><button class="btn" id="submitChangePass">确认修改</button></div>
            </form>
            <p class="warning" style="margin-top:0.5rem;">※ 管理员修改他人密码通过删除后重建实现；修改主管理员(zlm)密码需后端支持。</p>
        </div>
    </div>

    <!-- 成员自助修改密码模态框 -->
    <div class="modal-overlay" id="selfChangePassModal">
        <div class="modal">
            <button class="close-btn" id="closeSelfChangePassModal">&times;</button>
            <h2>修改我的密码</h2>
            <form onsubmit="return false">
                <div class="input-group"><label>旧密码</label><input type="password" id="selfOldPass" autocomplete="current-password"></div>
                <div class="input-group"><label>新密码</label><input type="password" id="selfNewPass" autocomplete="new-password"></div>
                <div class="modal-actions"><button class="btn" id="submitSelfChangePass">确认修改</button></div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            const API_BASE = 'https://myzlm.serveousercontent.com';
            const APPLY_STORAGE_KEY = 'ink_nav_site_applications';
            const THEME_STORAGE_KEY = 'ink_nav_theme';
            const PINNED_STORAGE_KEY = 'ink_nav_pinned';

            let currentUser = null;
            let sites = [];
            let siteApplications = JSON.parse(localStorage.getItem(APPLY_STORAGE_KEY) || '[]');
            let pinnedSites = JSON.parse(localStorage.getItem(PINNED_STORAGE_KEY) || '[]');
            let currentFilter = 'all';
            let searchQuery = '';
            let isLoading = true;

            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            function escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return String(text).replace(/[&<>"']/g, m => map[m]);
            }

            // Toast系统
            function showToast(message, type = 'info') {
                const container = $('#toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: '✅', error: '❌', info: '💡' };
                toast.innerHTML = `<span>${icons[type] || '💡'}</span> ${escapeHtml(message)}`;
                container.appendChild(toast);
                const duration = 2600;
                toast.style.animationDuration = '0.4s, 0.35s';
                toast.style.animationDelay = '0s, ' + (duration / 1000 - 0.35) + 's';
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, duration);
            }

            // API调用
            async function apiCall(url, options = {}, silent = false) {
                const config = {
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    ...options,
                };
                if (config.body && typeof config.body === 'object') config.body = JSON.stringify(config.body);
                try {
                    const res = await fetch(API_BASE + url, config);
                    if (!res.ok) {
                        if (silent) return null;
                        const data = await res.json().catch(() => ({}));
                        throw new Error(data.error || `请求失败 (${res.status})`);
                    }
                    return await res.json();
                } catch (e) {
                    if (silent) return null;
                    throw e;
                }
            }

            // 暗色模式
            function initTheme() {
                const saved = localStorage.getItem(THEME_STORAGE_KEY);
                if (saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    $('#themeToggle').textContent = '☀️';
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    $('#themeToggle').textContent = '🌓';
                }
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem(THEME_STORAGE_KEY, next);
                $('#themeToggle').textContent = next === 'dark' ? '☀️' : '🌓';
                showToast(next === 'dark' ? '已切换至暗色模式 🌙' : '已切换至亮色模式 ☀️', 'info');
            }

            // 获取过滤后的书签
            function getFilteredSites() {
                let filtered = [...sites];

                // 置顶排序
                if (pinnedSites.length > 0) {
                    const pinned = [];
                    const unpinned = [];
                    filtered.forEach((site, index) => {
                        if (pinnedSites.includes(index)) {
                            pinned.push({ ...site, _pinned: true, _originalIndex: index });
                        } else {
                            unpinned.push({ ...site, _pinned: false, _originalIndex: index });
                        }
                    });
                    filtered = [...pinned, ...unpinned];
                }

                // 分类筛选
                if (currentFilter !== 'all') {
                    filtered = filtered.filter(s => (s.category || '其他') === currentFilter);
                }

                // 搜索过滤
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    filtered = filtered.filter(s =>
                        (s.name || '').toLowerCase().includes(q) ||
                        (s.desc || '').toLowerCase().includes(q) ||
                        (s.url || '').toLowerCase().includes(q)
                    );
                }

                return filtered;
            }

            // 获取所有分类
            function getAllCategories() {
                const cats = new Set();
                sites.forEach(s => cats.add(s.category || '其他'));
                return ['all', ...Array.from(cats).sort()];
            }

            // 渲染分类标签
            function renderFilterTags() {
                const container = $('#filterTags');
                const categories = getAllCategories();
                const filtered = getFilteredSites();
                const allCount = currentFilter === 'all' && !searchQuery.trim() ? sites.length : getFilteredSites()
                    .length;

                container.innerHTML = categories.map(cat => {
                    const label = cat === 'all' ? '全部' : escapeHtml(cat);
                    const active = cat === currentFilter ? ' active' : '';
                    return `<span class="filter-tag${active}" data-category="${escapeHtml(cat)}">${label}</span>`;
                }).join('');

                // 更新计数
                const countEl = $('#filterCount');
                const totalFiltered = getFilteredSites().length;
                if (searchQuery.trim() || currentFilter !== 'all') {
                    countEl.textContent = `找到 ${totalFiltered} 个书签`;
                } else {
                    countEl.textContent = `共 ${sites.length} 个书签`;
                }

                // 绑定点击事件
                container.querySelectorAll('.filter-tag').forEach(tag => {
                    tag.addEventListener('click', () => {
                        currentFilter = tag.dataset.category;
                        renderFilterTags();
                        renderSites();
                    });
                });
            }

            // 更新UI
            function updateUIByRole() {
                const greeting = $('#greetingText');
                const loginBtn = $('#loginBtn');
                const logoutBtn = $('#logoutBtn');
                const adminBtn = $('#adminPanelBtn');
                const adminPanel = $('#adminPanel');
                const changeMyPassBtn = $('#changeMyPassBtn');
                const applySiteBtn = $('#applySiteBtn');

                if (currentUser) {
                    greeting.textContent =
                        `${currentUser.role === 'admin' ? '🔰' : '📖'} ${currentUser.username}`;
                    loginBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline-block';
                    changeMyPassBtn.style.display = 'inline-block';
                    applySiteBtn.style.display = 'inline-block';
                    if (currentUser.role === 'admin') {
                        adminBtn.style.display = 'inline-block';
                        adminPanel.style.display = 'block';
                    } else {
                        adminBtn.style.display = 'none';
                        adminPanel.style.display = 'none';
                    }
                } else {
                    greeting.textContent = '未登录·游客';
                    loginBtn.style.display = 'inline-block';
                    logoutBtn.style.display = 'none';
                    adminBtn.style.display = 'none';
                    adminPanel.style.display = 'none';
                    changeMyPassBtn.style.display = 'none';
                    applySiteBtn.style.display = 'none';
                }
                renderSites();
                renderFilterTags();
                if (currentUser && currentUser.role === 'admin') {
                    renderAdminPanels();
                }
            }

            // 渲染书签
            function renderSites() {
                const grid = $('#sitesGrid');

                if (isLoading) {
                    grid.innerHTML = Array.from({ length: 6 }, () => `
                        <div class="skeleton-card">
                          <div class="skeleton-seal"></div>
                          <div class="skeleton-lines">
                            <div class="skeleton-line medium"></div>
                            <div class="skeleton-line short"></div>
                          </div>
                        </div>
                      `).join('');
                    return;
                }

                const filtered = getFilteredSites();

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                          <span class="empty-icon">📭</span>
                          <p>${searchQuery.trim() || currentFilter !== 'all' ? '未找到匹配的书签，试试其他关键词吧' : '暂无书签，登录后可申请收录'}</p>
                        </div>
                      `;
                    return;
                }

                grid.innerHTML = filtered.map((site) => {
                    const isPinned = site._pinned;
                    const originalIndex = site._originalIndex !== undefined ? site._originalIndex : sites
                        .indexOf(site);
                    const card = document.createElement('a');
                    card.className = 'site-card';
                    card.href = site.url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.pin-indicator')) {
                            e.preventDefault();
                            return;
                        }
                        apiCall(`/api/sites/${originalIndex}/visit`, { method: 'POST' }, true).catch(
                            () => {});
                    });
                    card.innerHTML = `
                        <div class="seal">${escapeHtml(site.seal || '🔗')}</div>
                        <div class="site-info">
                          <div class="site-name">${isPinned ? '📌 ' : ''}${escapeHtml(site.name)}</div>
                          <div class="site-desc">${escapeHtml(site.desc || '')}</div>
                          <div class="site-meta">
                            <span class="site-category">${escapeHtml(site.category || '其他')}</span>
                            <span>👁️ ${site.visits || 0}</span>
                          </div>
                        </div>
                      `;
                    return card.outerHTML;
                }).join('');
            }

            function renderAdminPanels() { renderSiteManage();
                renderUserManage();
                renderApplyManage(); }

            function renderSiteManage() {
                const container = $('#siteListManage');
                container.innerHTML = sites.map((s, i) => `
                    <div class="list-item">
                      <span>${escapeHtml(s.name)} - <small>${escapeHtml(s.url)}</small></span>
                      <div style="display:flex;gap:0.3rem;align-items:center;">
                        <button class="btn icon-btn pin-toggle-btn" data-index="${i}" title="置顶/取消置顶">
                          ${pinnedSites.includes(i) ? '📌' : '📍'}
                        </button>
                        <button class="btn" data-del-site="${i}">删除</button>
                      </div>
                    </div>
                  `).join('');
                container.querySelectorAll('[data-del-site]').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if (!confirm('确认删除？')) return;
                        try {
                            await apiCall(`/api/sites/${e.target.dataset.delSite}`, { method: 'DELETE' });
                            // 同时从置顶中移除
                            const idx = parseInt(e.target.dataset.delSite);
                            pinnedSites = pinnedSites.filter(p => p !== idx).map(p => p > idx ? p -
                                1 : p);
                            localStorage.setItem(PINNED_STORAGE_KEY, JSON.stringify(pinnedSites));
                            await refreshSites();
                            showToast('网站已删除', 'success');
                        } catch (err) { showToast('删除失败: ' + err.message, 'error'); }
                    });
                });
                container.querySelectorAll('.pin-toggle-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = parseInt(e.target.dataset.index);
                        if (pinnedSites.includes(idx)) {
                            pinnedSites = pinnedSites.filter(p => p !== idx);
                            showToast('已取消置顶', 'info');
                        } else {
                            pinnedSites.push(idx);
                            showToast('已置顶', 'success');
                        }
                        localStorage.setItem(PINNED_STORAGE_KEY, JSON.stringify(pinnedSites));
                        renderSiteManage();
                        renderSites();
                    });
                });
            }

            async function refreshSites() {
                try {
                    sites = await apiCall('/api/sites');
                    isLoading = false;
                    renderSites();
                    renderFilterTags();
                    if (currentUser?.role === 'admin') renderSiteManage();
                } catch (e) {
                    isLoading = false;
                    renderSites();
                    renderFilterTags();
                }
            }

            async function refreshUsersAndRender() {
                if (!currentUser || currentUser.role !== 'admin') return;
                try {
                    const users = await apiCall('/api/users');
                    renderUserList(users);
                } catch (e) {}
            }

            function renderUserManage() { refreshUsersAndRender(); }

            function renderUserList(users) {
                const container = $('#userListManage');
                container.innerHTML = users.map(u => `
                    <div class="list-item">
                      <span>${escapeHtml(u.username)}</span>
                      <div style="display:flex;gap:0.3rem;">
                        <button class="btn change-pass-btn" data-username="${escapeHtml(u.username)}">改密</button>
                        ${u.username !== 'zlm' ? `<button class="btn del-user-btn" data-username="${escapeHtml(u.username)}">删除</button>` : ''}
                      </div>
                    </div>
                  `).join('');
                container.querySelectorAll('.del-user-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if (!confirm('删除用户？')) return;
                        try {
                            await apiCall(`/api/users/${encodeURIComponent(e.target.dataset.username)}`, {
                                method: 'DELETE' });
                            refreshUsersAndRender();
                            showToast('用户已删除', 'success');
                        } catch (err) { showToast('删除失败: ' + err.message, 'error'); }
                    });
                });
                container.querySelectorAll('.change-pass-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => openChangePassModal(e.target.dataset.username));
                });
            }

            function openChangePassModal(username) {
                $('#changePassUser').value = username;
                $('#changePassNew').value = '';
                $('#changePassModal').classList.add('active');
            }

            function renderApplyManage() {
                const container = $('#applyListManage');
                if (!siteApplications.length) {
                    container.innerHTML = '<p style="color:var(--text-muted);">暂无待审核的网站申请。</p>';
                    return;
                }
                container.innerHTML = siteApplications.map((app, idx) => `
                    <div class="list-item">
                      <span>${escapeHtml(app.name)} (${escapeHtml(app.url)})</span>
                      <div>
                        <button class="btn approve-site-btn" data-index="${idx}">通过</button>
                        <button class="btn reject-site-btn" data-index="${idx}">拒绝</button>
                      </div>
                    </div>
                  `).join('');
                container.querySelectorAll('.approve-site-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const idx = e.target.dataset.index;
                        const app = siteApplications[idx];
                        try {
                            await apiCall('/api/sites', {
                                method: 'POST',
                                body: {
                                    name: app.name,
                                    url: app.url,
                                    desc: app.desc || '',
                                    seal: app.seal || '🔗',
                                    category: app.category || '其他'
                                }
                            });
                            siteApplications.splice(idx, 1);
                            localStorage.setItem(APPLY_STORAGE_KEY, JSON.stringify(
                                siteApplications));
                            await refreshSites();
                            renderApplyManage();
                            showToast('网站已添加并通过审核', 'success');
                        } catch (err) { showToast('添加失败: ' + err.message, 'error'); }
                    });
                });
                container.querySelectorAll('.reject-site-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = e.target.dataset.index;
                        if (confirm('拒绝该申请？')) {
                            siteApplications.splice(idx, 1);
                            localStorage.setItem(APPLY_STORAGE_KEY, JSON.stringify(
                                siteApplications));
                            renderApplyManage();
                            showToast('申请已拒绝', 'info');
                        }
                    });
                });
            }

            async function checkLoginStatus() {
                const data = await apiCall('/api/me', {}, true);
                if (data && data.username) {
                    currentUser = data;
                } else {
                    currentUser = null;
                }
                updateUIByRole();
                if (currentUser?.role === 'admin') refreshUsersAndRender();
            }

            // 初始化云朵
            function initClouds() {
                const container = $('#cloudsContainer');
                for (let i = 0; i < 6; i++) {
                    const cloud = document.createElement('div');
                    cloud.className = 'cloud';
                    const size = 80 + Math.random() * 100;
                    cloud.style.width = size + 'px';
                    cloud.style.height = size * 0.6 + 'px';
                    cloud.style.top = (5 + Math.random() * 60) + '%';
                    cloud.style.animationDuration = (15 + Math.random() * 25) + 's';
                    cloud.style.animationDelay = Math.random() * 10 + 's';
                    container.appendChild(cloud);
                }
            }

            // 初始化花瓣
            function initPetals() {
                const canvas = $('#petalCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const isMobile = window.innerWidth < 768;
                const petals = [];
                const petalCount = isMobile ? 18 : 35;

                function resize() {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height;
                }
                window.addEventListener('resize', resize);
                resize();

                class Petal {
                    constructor() { this.reset(true); }
                    reset(initial = false) {
                        this.x = Math.random() * width;
                        this.y = initial ? Math.random() * height : -20;
                        this.size = 8 + Math.random() * 14;
                        this.speedY = 1 + Math.random() * 2.5;
                        this.speedX = 0.3 + Math.random() * 0.8;
                        this.rotation = Math.random() * Math.PI * 2;
                        this.rotSpeed = (Math.random() - 0.5) * 0.02;
                        this.opacity = 0.7 + Math.random() * 0.3;
                        this.color =
                            `rgba(${220 + Math.random()*35}, ${140 + Math.random()*40}, ${150 + Math.random()*30}, ${this.opacity})`;
                    }
                    update() {
                        this.y += this.speedY;
                        this.x += Math.sin(this.y * 0.02) * this.speedX;
                        this.rotation += this.rotSpeed;
                        if (this.y > height + 20) this.reset();
                    }
                    draw(ctx) {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.rotation);
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, this.size * 0.6, this.size * 0.3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(0, 0, this.size * 0.3, this.size * 0.6, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
                for (let i = 0; i < petalCount; i++) petals.push(new Petal());

                function animate() {
                    ctx.clearRect(0, 0, width, height);
                    petals.forEach(p => { p.update();
                        p.draw(ctx); });
                    requestAnimationFrame(animate);
                }
                animate();
            }

            // 初始化涟漪
            function initRipples() {
                const canvas = $('#rippleCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const ripples = [];
                const maxRipples = 15;

                function resize() {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height;
                }
                window.addEventListener('resize', resize);
                resize();

                function addRipple(x, y) {
                    ripples.push({
                        x,
                        y,
                        radius: 2,
                        maxRadius: 50 + Math.random() * 80,
                        opacity: 0.7,
                        speed: 0.8 + Math.random() * 0.6
                    });
                    if (ripples.length > maxRipples) ripples.shift();
                }

                window.addEventListener('click', (e) => addRipple(e.clientX, e.clientY));
                window.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) addRipple(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                function drawRipple(ctx, r) {
                    const gradient = ctx.createRadialGradient(r.x, r.y, r.radius * 0.1, r.x, r.y, r.radius);
                    gradient.addColorStop(0, `rgba(20, 15, 10, ${r.opacity})`);
                    gradient.addColorStop(0.4, `rgba(40, 30, 20, ${r.opacity * 0.7})`);
                    gradient.addColorStop(0.7, `rgba(80, 60, 40, ${r.opacity * 0.3})`);
                    gradient.addColorStop(1, `rgba(120, 90, 60, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                function animate() {
                    ctx.clearRect(0, 0, width, height);
                    for (let i = ripples.length - 1; i >= 0; i--) {
                        const r = ripples[i];
                        r.radius += r.speed;
                        r.opacity -= 0.008;
                        if (r.opacity <= 0 || r.radius > r.maxRadius) ripples.splice(i, 1);
                        else drawRipple(ctx, r);
                    }
                    requestAnimationFrame(animate);
                }
                animate();
            }

            // 回到顶部
            function initBackToTop() {
                const btn = $('#backToTop');
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 400) {
                        btn.classList.add('visible');
                    } else {
                        btn.classList.remove('visible');
                    }
                }, { passive: true });
                btn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // 绑定事件
            function bindEvents() {
                // 暗色模式切换
                $('#themeToggle').addEventListener('click', toggleTheme);

                // 搜索
                const searchInput = $('#searchInput');
                const searchClear = $('#searchClear');
                let searchDebounce;

                searchInput.addEventListener('input', () => {
                    clearTimeout(searchDebounce);
                    searchDebounce = setTimeout(() => {
                        searchQuery = searchInput.value;
                        if (searchQuery.trim()) {
                            searchClear.classList.add('visible');
                        } else {
                            searchClear.classList.remove('visible');
                        }
                        renderFilterTags();
                        renderSites();
                    }, 200);
                });
                searchClear.addEventListener('click', () => {
                    searchInput.value = '';
                    searchQuery = '';
                    searchClear.classList.remove('visible');
                    renderFilterTags();
                    renderSites();
                    searchInput.focus();
                });

                // 快捷键
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                        searchInput.select();
                    }
                    if (e.key === 'Escape' && document.activeElement === searchInput) {
                        searchInput.value = '';
                        searchQuery = '';
                        searchClear.classList.remove('visible');
                        renderFilterTags();
                        renderSites();
                        searchInput.blur();
                    }
                    // 按 / 快速聚焦搜索
                    if (e.key === '/' && document.activeElement === document.body && !e.target.closest(
                            'input') && !e.target.closest('textarea')) {
                        e.preventDefault();
                        searchInput.focus();
                    }
                });

                // 登录
                $('#loginBtn').addEventListener('click', () => $('#loginModal').classList.add('active'));
                $('#closeLoginModal').addEventListener('click', () => $('#loginModal').classList.remove('active'));
                $('#submitLogin').addEventListener('click', async () => {
                    const username = $('#loginUsername').value.trim();
                    const password = $('#loginPassword').value;
                    if (!username || !password) return showToast('请输入账号和密码', 'error');
                    try {
                        const data = await apiCall('/api/login', { method: 'POST', body: { username,
                                password } });
                        currentUser = { username: data.username, role: data.role };
                        $('#loginModal').classList.remove('active');
                        updateUIByRole();
                        if (currentUser.role === 'admin') refreshUsersAndRender();
                        showToast(`登录成功，欢迎 ${data.username}`, 'success');
                    } catch (err) { showToast('登录失败: ' + err.message, 'error'); }
                });

                $('#logoutBtn').addEventListener('click', async () => {
                    await apiCall('/api/logout', { method: 'POST' });
                    currentUser = null;
                    updateUIByRole();
                    showToast('已登出', 'info');
                });

                // 管理员面板切换
                $('#adminPanelBtn').addEventListener('click', () => {
                    const panel = $('#adminPanel');
                    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                });

                // 选项卡
                $$('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        $$('.tab-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        $$('.tab-content').forEach(c => c.classList.remove('active'));
                        $('#' + this.dataset.tab).classList.add('active');
                    });
                });

                // 管理员添加网站
                $('#addSiteBtn').addEventListener('click', async () => {
                    const name = $('#newSiteName').value.trim();
                    const url = $('#newSiteUrl').value.trim();
                    if (!name || !url) return showToast('名称和网址必填', 'error');
                    try {
                        await apiCall('/api/sites', {
                            method: 'POST',
                            body: {
                                name,
                                url,
                                desc: $('#newSiteDesc').value.trim(),
                                seal: $('#newSiteSeal').value.trim() || '🔗',
                                category: $('#newSiteCat').value.trim() || '其他'
                            }
                        });
                        ['newSiteName', 'newSiteUrl', 'newSiteDesc', 'newSiteSeal', 'newSiteCat'].forEach(
                            id => $('#' + id).value = '');
                        await refreshSites();
                        showToast('网站已添加', 'success');
                    } catch (err) { showToast(err.message, 'error'); }
                });

                // 管理员添加用户
                $('#addUserBtn').addEventListener('click', async () => {
                    const username = $('#newUsername').value.trim();
                    const password = $('#newUserPass').value;
                    if (!username || !password) return showToast('用户名和密码不能为空', 'error');
                    try {
                        await apiCall('/api/users', { method: 'POST', body: { username, password } });
                        $('#newUsername').value = '';
                        $('#newUserPass').value = '';
                        refreshUsersAndRender();
                        showToast('用户已添加', 'success');
                    } catch (err) { showToast(err.message, 'error'); }
                });

                // 管理员批量改密
                $('#submitChangePass').addEventListener('click', async () => {
                    const username = $('#changePassUser').value;
                    const newPass = $('#changePassNew').value;
                    if (!newPass) return showToast('请输入新密码', 'error');
                    if (username === 'zlm') { showToast('修改主管理员密码需要后端专用接口。', 'error');
                        return; }
                    if (!confirm(`将通过删除并重建用户"${username}"来修改密码，继续？`)) return;
                    try {
                        await apiCall(`/api/users/${encodeURIComponent(username)}`, { method: 'DELETE' });
                        await apiCall('/api/users', { method: 'POST', body: { username, password: newPass } });
                        showToast('密码已修改', 'success');
                        $('#changePassModal').classList.remove('active');
                        refreshUsersAndRender();
                    } catch (err) { showToast('操作失败: ' + err.message, 'error'); }
                });
                $('#closeChangePassModal').addEventListener('click', () => $('#changePassModal').classList.remove(
                    'active'));

                // 成员自助改密
                $('#changeMyPassBtn').addEventListener('click', () => {
                    $('#selfOldPass').value = '';
                    $('#selfNewPass').value = '';
                    $('#selfChangePassModal').classList.add('active');
                });
                $('#closeSelfChangePassModal').addEventListener('click', () => $('#selfChangePassModal').classList
                    .remove('active'));
                $('#submitSelfChangePass').addEventListener('click', async () => {
                    const oldPass = $('#selfOldPass').value;
                    const newPass = $('#selfNewPass').value;
                    if (!oldPass || !newPass) return showToast('请输入旧密码和新密码', 'error');
                    if (newPass.length < 6) return showToast('新密码长度至少6位', 'error');
                    try {
                        await apiCall('/api/me/password', { method: 'PUT', body: { oldPassword: oldPass,
                                newPassword: newPass } });
                        showToast('密码修改成功', 'success');
                        $('#selfChangePassModal').classList.remove('active');
                    } catch (err) { showToast('修改失败: ' + err.message, 'error'); }
                });

                // 网站申请
                $('#applySiteBtn').addEventListener('click', () => {
                    $('#applyName').value = '';
                    $('#applyUrl').value = '';
                    $('#applyDesc').value = '';
                    $('#applySeal').value = '';
                    $('#applyCat').value = '';
                    $('#applyModal').classList.add('active');
                });
                $('#closeApplyModal').addEventListener('click', () => $('#applyModal').classList.remove('active'));
                $('#submitApply').addEventListener('click', () => {
                    const name = $('#applyName').value.trim();
                    const url = $('#applyUrl').value.trim();
                    if (!name || !url) return showToast('网站名称和网址为必填项', 'error');
                    siteApplications.push({
                        name,
                        url,
                        desc: $('#applyDesc').value.trim(),
                        seal: $('#applySeal').value.trim() || '🔗',
                        category: $('#applyCat').value.trim() || '其他'
                    });
                    localStorage.setItem(APPLY_STORAGE_KEY, JSON.stringify(siteApplications));
                    showToast('申请已提交，请等待管理员审核', 'success');
                    $('#applyModal').classList.remove('active');
                });

                // 点击遮罩关闭模态框
                window.addEventListener('click', (e) => {
                    if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('active');
                });
            }

            async function init() {
                initTheme();
                initClouds();
                initPetals();
                initRipples();
                initBackToTop();
                bindEvents();
                try {
                    sites = await apiCall('/api/sites');
                    isLoading = false;
                } catch (e) {
                    sites = [];
                    isLoading = false;
                }
                await checkLoginStatus();
                renderSites();
                renderFilterTags();
            }

            init();
        })();
    </script>
</body>
</html>
